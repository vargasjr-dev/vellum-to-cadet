name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # --timeout: bun default is 5s; the full-workspace e2e sits right at
        # the edge on CI runners (~5.2s) and bunfig.toml [test] timeout is
        # ignored by bun 1.3.11. Quality over speed: 10s for every test.
        run: bun test --timeout=10000
