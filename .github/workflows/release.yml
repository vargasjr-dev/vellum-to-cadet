name: Release

# Dispatch-only release: publish from the dispatched branch, then merge it to
# main. GitHub Actions already lets you pick the target branch when dispatching.
# Invocable only by Vargas — everyone else gets a skipped run.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to both packages
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'dvargasfuertes'
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Bump versions (kept in sync)
        id: bump
        run: |
          cd packages/core
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          cd ../alias
          npm version "$VERSION" --exact --no-git-tag-version
          npm pkg set "dependencies.@mycadet/vellum=^$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - name: Setup node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5.1 (trusted publishing requires it)
          registry-url: https://registry.npmjs.org

      - name: Publish @mycadet/vellum
        run: npm publish --access public
        working-directory: packages/core

      - name: Publish migrate-vellum-assistant-to-cadet
        run: npm publish --access public
        working-directory: packages/alias

      - name: Commit bump and tag
        run: |
          git config user.name "vargas-jr[bot]"
          git config user.email "214182090+vargas-jr[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "$RELEASE_BRANCH"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Merge release branch into main
        run: |
          git config user.name "vargas-jr[bot]"
          git config user.email "214182090+vargas-jr[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "origin/$RELEASE_BRANCH" -m "Merge $RELEASE_BRANCH (release v${{ steps.bump.outputs.version }})"
          git push origin main
