# Dispatch-only release: publish the version already committed on the
# dispatched branch, tag it, then merge the branch into main. Bumps are done
# manually before dispatching; the create-release-branch pattern from
# mycadet-temp may replace that later. Invocable only by Vargas.

name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'dvargasfuertes'
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Bumps happen manually on the branch before dispatching — the workflow
      # publishes exactly the version committed here.
      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $RELEASE_BRANCH"

      - name: Build
        run: bun run build

      - name: Setup node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5.1 (trusted publishing requires it)
          registry-url: https://registry.npmjs.org

      - name: Publish @mycadet/vellum
        run: npm publish --access public
        working-directory: packages/core

      - name: Publish migrate-vellum-assistant-to-cadet
        run: npm publish --access public
        working-directory: packages/alias

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Merge release branch into main
        run: |
          git config user.name "vargas-jr[bot]"
          git config user.email "214182090+vargas-jr[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "origin/$RELEASE_BRANCH" -m "Merge $RELEASE_BRANCH (release v${{ steps.version.outputs.version }})"
          git push origin main

      # The release is merged and tagged — the branch has served its purpose
      # and would only linger (release/v0.0.2 hung around until now).
      - name: Delete the release branch
        run: git push origin --delete "$RELEASE_BRANCH"
